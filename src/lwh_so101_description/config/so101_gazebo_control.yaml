gazebo:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100

  shoulder_pan_position_controller:
    type: position_controllers/JointPositionController
    joint: shoulder_pan
    pid: {p: 25.0, i: 0.0, d: 1.0}

  shoulder_lift_position_controller:
    type: position_controllers/JointPositionController
    joint: shoulder_lift
    pid: {p: 30.0, i: 0.0, d: 1.2}

  elbow_flex_position_controller:
    type: position_controllers/JointPositionController
    joint: elbow_flex
    pid: {p: 25.0, i: 0.0, d: 1.0}

  wrist_flex_position_controller:
    type: position_controllers/JointPositionController
    joint: wrist_flex
    pid: {p: 15.0, i: 0.0, d: 0.6}

  wrist_roll_position_controller:
    type: position_controllers/JointPositionController
    joint: wrist_roll
    pid: {p: 10.0, i: 0.0, d: 0.4}

  gripper_position_controller:
    type: position_controllers/JointPositionController
    joint: gripper
    pid: {p: 8.0, i: 0.0, d: 0.25}
