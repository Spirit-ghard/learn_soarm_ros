      i: 1
      i_clamp: 1
    elbow_flex:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    wrist_flex:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    wrist_roll:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
